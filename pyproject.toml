[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-osint"
version = "0.1.0-alpha"
description = "Universal Multi-Model Intelligence & Open-Source Investigation Framework"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "ATLAS-OSINT Contributors"}
]
dependencies = [
    "dnspython>=2.6.0",
    "requests>=2.32.0",
    "python-whois>=0.9.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.8.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
